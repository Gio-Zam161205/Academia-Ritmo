<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academia Ritmo - Inicio de Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/log.css">
</head>
<body>

  <div class="login-wrapper">
    <!-- Encabezado / Logo institucional -->
    <div class="brand-header">
      <div class="brand-icon">💃</div>
      <h1 class="brand-title">Academia Ritmo</h1>
      <p class="brand-subtitle">Sistema de Gestión de Aulas y Recepción</p>
    </div>

    <!-- Formulario de Login -->
    <div class="login-card">
      <h2 class="card-title">Iniciar Sesión</h2>
      <p class="card-instruction">Ingresa tus credenciales institucionales para acceder.</p>

      <!-- Alerta de Error / Notificación -->
      <div id="alertBox" class="alert-box" style="display: none;"></div>

      <form id="loginForm" novalidate>
        <!-- Campo Usuario / Matrícula -->
        <div class="form-group">
          <label for="username">Usuario o Correo</label>
          <div class="input-container">
            <span class="input-icon">👤</span>
            <input 
              type="text" 
              id="username" 
              name="username" 
              placeholder="ej. docente@ritmo.edu" 
              required
              autocomplete="username"
            >
          </div>
        </div>

        <!-- Campo Contraseña -->
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-container">
            <span class="input-icon">🔒</span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="••••••••" 
              required
              autocomplete="current-password"
            >
            <button type="button" id="togglePasswordBtn" class="toggle-password" title="Mostrar contraseña">👁️</button>
          </div>
        </div>

        <!-- Opciones secundarias -->
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe">
            <span>Recordar sesión</span>
          </label>
          <a href="#" id="forgotPasswordLink" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Botón de Envío -->
        <button type="submit" id="submitBtn" class="btn-submit">
          <span>Ingresar al Sistema</span>
          <span class="spinner" style="display: none;">⏳</span>
        </button>
      </form>

      <!-- Accesos Rápidos de Prueba (Demo) -->
      <div class="demo-section">
        <span class="demo-title">No tienes cuenta:</span>
        <div class="demo-buttons">
          <button type="button" class="btn-demo" data-user="prof.carlos" data-pass="docente123" href="registrer.html">
            Registrate
          </button>
          
        </div>
      </div>
    </div>

    <!-- Pie de página informativo -->
    <div class="login-footer">
      <p>&copy; 2026 Academia de Baile "Ritmo" &bull; Todos los derechos reservados.</p>
    </div>
  </div>

  <script src="JS/log.js"></script>
</body>
</html>
