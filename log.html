<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academia Ritmo - Inicio de Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/log.css">
</head>
<body>

  <!-- Canvas ti Background Animation -->
  <canvas id="bgCanvas"></canvas>

  <div class="login-wrapper">
    <!-- Branding Institucional -->
    <div class="brand-header">
      <h1 class="brand-title">Academia Ritmo</h1>
      <p class="brand-subtitle">Sistema de Gestión de Aulas y Recepción</p>
    </div>

    <!-- Tarjeta de Login -->
    <div class="login-card">
      <h2 class="card-title">Iniciar Sesión</h2>
      <p class="card-instruction">Ingresa tus credenciales institucionales para acceder.</p>

      <div id="alertBox" class="alert-box" style="display: none;"></div>

   

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-container">
            <span class="input-icon">🔒</span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="••••••••" 
              required
              autocomplete="current-password"
            >
            <button type="button" id="togglePasswordBtn" class="toggle-password" title="Mostrar contraseña">👁️</button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe">
            <span>Recordar sesión</span>
          </label>
          <a href="#" id="forgotPasswordLink" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          <span>Ingresar al Sistema</span>
          <span class="spinner" style="display: none;">⏳</span>
        </button>
      </form>
        <div class="demo-section">
          <span class="demo-title">¿No tienes cuenta?</span>
          <div class="demo-buttons">
            <a href="registrer.html" class="btn-demo" style="text-decoration: none; text-align: center; display: block; width: 100%;">
              Regístrate
            </a>
          </div>
        </div>
    </div>

    <div class="login-footer">
      <p>&copy; 2026 Academia de Baile "Ritmo" &bull; Todos los derechos reservados.</p>
    </div>
  </div>

  <script src="js/log.js"></script>
</body>
</html>
